mmim:
  hidden_dim: 64
  dropout: 0.2
  cpc_layers: 1
  alpha: 0.1
  beta: 0.1
  grad_clip: 0.8
  lr: 1e-4

mfn:
  hidden_dim: 128
  mem_dim: 128
  dropout: 0.3
  window_dim: 2
  grad_clip: -1.0
  lr: 1e-3

graph_mfn:
  hidden_dim: 128
  mem_dim: 128
  dropout: 0.3
  grad_clip: -1.0
  lr: 1e-3

mfm:
  hidden_dim: 128
  mem_dim: 128
  dropout: 0.3
  window_dim: 2
  lda_xl: 0.1
  lda_xa: 0.1
  lda_xv: 0.1
  lda_mmd: 10
  grad_clip: -1.0
  lr: 1e-3

mctn:
  hidden_dim: 64
  dropout: 0.2
  teacher_forcing_ratio: 0.5
  loss_weight: 0.3
  grad_clip: 0.8
  lr: 1e-4
